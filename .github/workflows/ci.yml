name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -r requirements.txt
          python -m pip install pre-commit==4.6.0

      - name: Detect secrets
        run: pre-commit run detect-secrets --all-files

      - name: Run all pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Compile Python sources
        run: python -m compileall danbooru_upsampler __init__.py

      - name: Verify package-style ComfyUI bootstrap
        run: >-
          python -c "import importlib.util, pathlib, sys;
          root = pathlib.Path('__init__.py').resolve();
          name = 'comfyui_danbooru_tags_upsampler_root';
          spec = importlib.util.spec_from_file_location(name, root, submodule_search_locations=[str(root.parent)]);
          module = importlib.util.module_from_spec(spec);
          sys.modules[name] = module;
          spec.loader.exec_module(module);
          assert sorted(module.NODE_CLASS_MAPPINGS) == ['DanbooruTagsUpsampler', 'DanbooruTagsUpsamplerNodeRay']"

      - name: Run network-free unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify E2E replacement lane
        run: >-
          python -c "from pathlib import Path;
          assert not Path('package.json').exists();
          print('E2E replacement lane: compile, package import, metadata, and unit checks passed.')"
